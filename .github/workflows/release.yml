name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: go test ./internal/engine ./internal/secret
      - run: go build -ldflags "-s -w" -o peanut.exe .
      - run: (Get-FileHash peanut.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii peanut.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            peanut.exe
            peanut.exe.sha256
